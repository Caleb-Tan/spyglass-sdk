[project]
name = "spyglass-sdk"
version = "0.1.0"
description = "The API layer for the social internet. Search brands, creators, and the ads they run."
authors = [{ name = "Spyglass" }]
keywords = ["spyglass", "ads", "advertising", "api"]

[project.urls]
Homepage = "https://spyglass.so"
Documentation = "https://docs.spyglass.so"
Source = "https://github.com/Caleb-Tan/spyglass-sdk"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spyglass"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = ["src"]
